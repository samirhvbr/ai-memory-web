# Run the suite on every push and pull request.
#
# ## Why this file exists (measured 2026-09-22, `f197`)
#
# It did not. `.github/workflows/` held only `release.yml`, which publishes a Release when
# `version.md` moves and never runs a test. So the suite ran only where somebody happened
# to type `php artisan test` — and on the machine where that was measured, **62 of 98
# tests were skipped**, because `ext-pdo_sqlite` (a declared requirement in
# `composer.json`) is not installed there.
#
# Sixty-two tests that skip locally and run nowhere else are not coverage; they are a
# green tick over an untested third of the app. This job installs the extension, so they
# run.
#
# ⚠️ The suite is DELIBERATELY configured against an unreachable index: `phpunit.xml` sets
# `AI_MEMORY_SQLITE_PATH` to the empty string, and the panel's contract (docs/read-only.md
# §4) is that every screen answers 200 with a notice in that state. Do not "fix" that by
# pointing CI at a real index — the notice path is what is being tested.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Pinned by SHA, not by tag: a moving tag is a dependency somebody else can
      # rewrite after review. The comment carries the human-readable version.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, mbstring, dom, fileinfo
          coverage: none

      # A lock file out of step with composer.json means `composer install` is resolving
      # something other than what the manifest asks for, and it says so as a WARNING that
      # scrolls past. Measured on this workflow's first green run: it was already stale.
      - name: Manifest and lock agree
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # The suite needs an APP_KEY and there is no .env in a clean checkout: without
      # one, every test that boots the encrypter dies with MissingAppKeyException, and
      # the error does not mention the .env. Measured on this workflow's first run: 47
      # of 51 failures were this, and none of them were about the app.
      #
      # Generated per run rather than committed: a key-shaped literal in the repository
      # is the kind of thing that gets copied somewhere it matters.
      # phpdotenv warns once per test when there is no .env — 102 warnings on the first
      # green run, all of them this. An EMPTY file is the whole fix: Laravel loads the
      # environment immutably, so a real environment variable still wins, and phpdotenv
      # stops complaining about a file it cannot open.
      #
      # ⚠️ Empty on purpose. Copying .env.example here would make CI depend on a file
      # whose contents nobody reviews on this path, and the suite's configuration lives
      # in phpunit.xml, which is the reviewed one.
      - name: An empty .env, so phpdotenv stops warning
        run: touch .env

      - name: Application key
        run: echo "APP_KEY=base64:$(php -r 'echo base64_encode(random_bytes(32));')" >> "$GITHUB_ENV"

      - name: Style
        run: ./vendor/bin/pint --test

      # `--display-warnings` because the first green run reported "102 warnings" — one
      # per test — with no text anywhere in the log saying what they were. A count with
      # no cause is not a signal, it is a thing people learn to scroll past.
      - name: Tests
        run: php artisan test --display-warnings --log-junit junit.xml

      # A SKIP IS NOT A PASS. The suite that motivated this file reported "36 passed"
      # while skipping 62 of its 98 tests, and nothing in that line said so.
      #
      # This reads the junit of the run above — it does NOT run the suite a second
      # time, which would both double the job and risk measuring a different run.
      # It exits 2 when it cannot read the file, because "did not measure" must never
      # be readable as "clean".
      - name: Refuse a suite that skipped
        if: always()
        run: |
          php -r '
            $f = "junit.xml";
            if (! is_file($f)) { fwrite(STDERR, "no junit.xml — did not measure\n"); exit(2); }
            $x = @simplexml_load_file($f);
            if ($x === false) { fwrite(STDERR, "junit.xml unreadable — did not measure\n"); exit(2); }
            $total = count($x->xpath("//testcase"));
            $skipped = count($x->xpath("//skipped"));
            if ($total === 0) { fwrite(STDERR, "junit.xml has no testcase — did not measure\n"); exit(2); }
            printf("%d testcase(s), %d skipped\n", $total, $skipped);
            // An ALLOWLIST, not a count: a count lets a deliberate skip be traded for
            // an accidental one without the number moving.
            $lista = "tests/expected-skips.txt";
            if (! is_file($lista)) { fwrite(STDERR, "no $lista — did not measure\n"); exit(2); }
            $permitidos = array_filter(array_map("trim", file($lista)), fn ($l) => $l !== "" && $l[0] !== "#");

            $inesperados = [];
            foreach ($x->xpath("//testcase[skipped]") as $t) {
              $nome = (string) $t["class"] . "::" . (string) $t["name"];
              if (! in_array($nome, $permitidos, true)) { $inesperados[] = $nome; }
            }

            if ($inesperados !== []) {
              foreach ($inesperados as $n) { printf("::error::unexpected skip: %s\n", $n); }
              fwrite(STDERR, count($inesperados) . " unexpected skip(s) — a skipped suite is not a green suite.\n");
              fwrite(STDERR, "If the skip is correct, say so in $lista and explain why.\n");
              exit(1);
            }
          '
